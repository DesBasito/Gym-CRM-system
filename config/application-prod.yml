server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:6543/gym_db
    username: postgres
    password: qwe
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migrations

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: epam.gym.infrastructure.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
